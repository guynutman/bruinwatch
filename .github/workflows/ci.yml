name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the codebase uses X | Y union syntax.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # The suite runs entirely against fixtures in fixtures/, so CI never
      # touches UCLA's servers -- no flakiness, no rate limiting, no load
      # on a public endpoint from every push.
      - name: Test
        run: pytest -q
